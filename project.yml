name: koemakase
options:
  bundleIdPrefix: com.kenta3578
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    # サプライチェーン: 実際に使う revision は Git 追跡している
    # koemakase.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved で固定される。
    # 依存を上げるときは -resolvePackageDependencies し直して同ファイルをコミットすること。
    from: "0.9.0"

targets:
  koemakase:
    type: application
    platform: macOS
    scheme:
      testTargets:
        - koemakaseTests
    sources:
      - path: Sources
      # koemakase の開始音・停止音（Issue #2）。scripts/make-sounds.py が作る。
      # フォルダ参照なので Contents/Resources/Sounds/ にそのまま入る。
      - path: Resources/Sounds
        type: folder
        buildPhase: resources
    dependencies:
      - package: WhisperKit
    settings:
      base:
        PRODUCT_NAME: koemakase
        PRODUCT_BUNDLE_IDENTIFIER: com.kenta3578.koebun
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/Info.plist
        SWIFT_VERSION: "5.9"
        # 言語モードは Swift 5 のまま、データ競合の検査だけ最大にする（Issue #103）。
        # 型で競合を防げているかをコンパイラに確かめさせる唯一の手段。
        SWIFT_STRICT_CONCURRENCY: complete
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        # ローカル実行前提: sandbox OFF（Accessibility / CGEvent / グローバル監視のため必須）
        # ⚠️ 他者へ配布する段階では ENABLE_HARDENED_RUNTIME: YES + entitlements 最小化
        #    + Developer ID 署名 + Notarization に切り替えること。手順は RELEASING.md
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        # 署名は Xcode で開いた時に各自の Personal Team を割り当てる
        CODE_SIGN_STYLE: Automatic

  # 単体テスト（Issue #102）。アプリを TEST_HOST にして同じモジュールとして見る
  # （守備範囲とホスト側の起動抑止は Tests/README.md）。
  # TEST_HOST / BUNDLE_LOADER は xcodegen がアプリ依存から自動で埋める。
  koemakaseTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
        excludes:
          - README.md
    dependencies:
      - target: koemakase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kenta3578.koebunTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
