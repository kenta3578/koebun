name: koebun
options:
  bundleIdPrefix: com.kenta3578
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    # サプライチェーン: 実際に使う revision は Git 追跡している
    # koebun.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved で固定される。
    # 依存を上げるときは -resolvePackageDependencies し直して同ファイルをコミットすること。
    from: "0.9.0"
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    # 2.30.x に固定する。上下どちらにもズラせない理由がある:
    #  - 2.31.0 以降は swift-transformers 1.2.x を要求し、WhisperKit 0.18.0 の
    #    `.upToNextMinor(from: "1.1.6")` と範囲が交わらず SPM が解決できない
    #  - 3.x は swift-transformers を捨てて別パッケージ（swift-huggingface）＋マクロ経由になり、
    #    xgrammar(C++) と swift-syntax まで引き込む
    # 2.30.6 は swift-transformers 1.1.x を要求するので WhisperKit と同じ pin に乗る。
    # WhisperKit を 1.x に上げれば 2.31/3.x も選べるが、それは別 Issue。
    minVersion: "2.30.6"
    maxVersion: "2.31.0"

targets:
  koebun:
    type: application
    platform: macOS
    sources:
      - path: Sources
    dependencies:
      - package: WhisperKit
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
    settings:
      base:
        PRODUCT_NAME: koebun
        PRODUCT_BUNDLE_IDENTIFIER: com.kenta3578.koebun
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/Info.plist
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        # ローカル実行前提: sandbox OFF（Accessibility / CGEvent / グローバル監視のため必須）
        # ⚠️ 他者へ配布する段階では ENABLE_HARDENED_RUNTIME: YES + entitlements 最小化
        #    + Developer ID 署名 + Notarization に切り替えること。手順は RELEASING.md
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        # 署名は Xcode で開いた時に各自の Personal Team を割り当てる
        CODE_SIGN_STYLE: Automatic
